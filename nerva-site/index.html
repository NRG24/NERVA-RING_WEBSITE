<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NERVA Ring is a smart ring that measures your nervous system. Continuous heart rate, blood oxygen, and stress (GSR/EDA) from a single finger-worn device."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>NERVA Ring: the ring that reads your nervous system</title>

    <!-- favicon.ico first and unsized: browsers request /favicon.ico on their own,
         and without a real file there Pages serves index.html as text/html for it.
         Green (#30D158) on transparent, no tile, so the mark sits on the white nav
         and on either tab strip without carrying a box. Checked at 16px against
         white, Chrome light, and both Chrome dark tab colors. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://nervaring.com/" />

    <!-- Kicks off the hero film's download before React even mounts, since it's
         the largest above-the-fold asset and autoplays immediately. -->
    <link rel="preload" as="video" type="video/mp4" href="/ring_void_16x9_0001-0400.mp4" fetchpriority="high" />

    <!-- Social sharing. NOTE: update the domain below once the real one is live.
         og:image must be an absolute URL or most scrapers will ignore it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NERVA Ring" />
    <meta property="og:url" content="https://nervaring.com/" />
    <meta property="og:title" content="NERVA Ring: the ring that reads your nervous system" />
    <meta
      property="og:description"
      content="Most wearables measure your heart. NERVA Ring pairs heart rate and blood oxygen with continuous skin-conductance (GSR) sensing, a live read on stress, recovery, and arousal, from a single ring."
    />
    <meta property="og:image" content="https://nervaring.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The NERVA Ring, showing the sensor electronics inside the band." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NERVA Ring: the ring that reads your nervous system" />
    <meta
      name="twitter:description"
      content="A solo-built smart ring pairing HR and SpO₂ with continuous GSR sensing. Follow the build."
    />
    <meta name="twitter:image" content="https://nervaring.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

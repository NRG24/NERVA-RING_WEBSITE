<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <title>NERVA: page not found</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #ffffff; --ink: #0a0a0c; --ink-2: #55565b; --ink-3: #86868b;
        --accent: #0071e3; --accent-dk: #0077ed; --line-2: rgba(11, 11, 13, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        gap: 18px; padding: 24px;
        background: var(--paper); color: var(--ink);
        font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .eyebrow {
        font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px; font-weight: 500; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--ink-3);
      }
      h1 { margin: 0; font-weight: 800; letter-spacing: -0.03em; font-size: clamp(1.8rem, 1.3rem + 2vw, 2.6rem); }
      p { margin: 0; max-width: 46ch; color: var(--ink-2); font-size: 1.05rem; line-height: 1.55; }
      .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
      a.btn {
        display: inline-flex; align-items: center; padding: 12px 22px;
        border-radius: 999px; font-weight: 600; font-size: 15px;
        text-decoration: none; border: 1px solid var(--line-2); color: var(--ink);
        transition: background 0.18s ease, border-color 0.18s ease;
      }
      a.btn--accent { background: var(--accent); color: #fff; border-color: transparent; }
      a.btn--accent:hover { background: var(--accent-dk); }
      a.btn--ghost:hover { border-color: var(--ink); }
    </style>
  </head>
  <body>
    <span class="eyebrow">404</span>
    <h1>That page doesn't exist.</h1>
    <p>The link may be old, or mistyped. Here's where you probably meant to go.</p>
    <div class="links">
      <a class="btn btn--accent" href="/">Back to the build</a>
      <a class="btn btn--ghost" href="/updates.html">FAQ &amp; updates</a>
    </div>
  </body>
</html>

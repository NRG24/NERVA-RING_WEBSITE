<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Join the NERVA Ring waitlist: a solo-built smart ring pairing heart rate and blood oxygen with continuous skin-conductance stress sensing. Hear first when beta testing opens and when it launches."
    />
    <meta name="theme-color" content="#06251a" />
    <title>NERVA Ring: join the waitlist</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- waitlist.html is served at /waitlist: Cloudflare's default
         html_handling drops the extension -->
    <link rel="canonical" href="https://nervaring.com/waitlist" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NERVA Ring" />
    <meta property="og:url" content="https://nervaring.com/waitlist" />
    <meta property="og:title" content="Join the NERVA Ring waitlist" />
    <meta
      property="og:description"
      content="A smart ring that reads heart rate, blood oxygen, and stress through your skin. Hear first when beta testing opens and when it launches."
    />
    <!-- JPEG on purpose: some link-preview scrapers still refuse WebP -->
    <meta property="og:image" content="https://nervaring.com/og-prototype.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The NERVA Ring bench prototype in a black ceramic band, its green LED lit inside." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Join the NERVA Ring waitlist" />
    <meta
      name="twitter:description"
      content="A smart ring that reads heart rate, blood oxygen, and stress through your skin."
    />
    <meta name="twitter:image" content="https://nervaring.com/og-prototype.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Join the NERVA Ring waitlist",
        "url": "https://nervaring.com/waitlist",
        "description": "Join the waitlist for NERVA Ring, a smart ring that reads heart rate, blood oxygen, and stress through your skin.",
        "isPartOf": { "@type": "WebSite", "name": "NERVA Ring", "url": "https://nervaring.com/" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/waitlist-main.tsx"></script>
  </body>
</html>
